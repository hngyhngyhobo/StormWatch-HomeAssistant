# StormWatch — plain-YAML automations (no blueprint required)
#
# Equivalent to examples/blueprints/stormwatch_severe_alerts.yaml and
# examples/blueprints/stormwatch_pool_alerts.yaml, for anyone who'd rather
# edit YAML directly than import a blueprint. Routes NWS alerts
# (stormwatch/event/alert_issued) and pool/lightning events
# (stormwatch/event/lightning_close, stormwatch/event/all_clear) per the
# StormWatch notification discipline (DESIGN.md §6, §8).
#
# >>> BEFORE USE <<<
# Replace every `notify.mobile_app_REPLACE_ME` service call below with your
# own mobile_app notify service (e.g. `notify.mobile_app_pixel_8`). Find
# yours under Settings > Devices & Services > Mobile App, or search
# Developer Tools > Actions for services starting with `notify.mobile_app_`.
#
# Merge this into configuration.yaml, e.g.:
#   automation stormwatch: !include examples/automations.yaml
# or copy the entries below into your existing automations.yaml.

- id: stormwatch_severe_alerts
  alias: StormWatch - Severe Weather Alerts
  description: >-
    Routes StormWatch NWS alerts (stormwatch/event/alert_issued) by
    priority. Plain-YAML equivalent of the severe-alerts blueprint.
  mode: queued
  max: 10
  trigger:
    - platform: mqtt
      topic: stormwatch/event/alert_issued
  variables:
    headline: "{{ trigger.payload_json.headline }}"
    priority: "{{ trigger.payload_json.priority }}"
    description: "{{ trigger.payload_json.description }}"
  action:
    - choose:
        # critical: tornado warnings, lightning inside CLOSE_RADIUS. Rare
        # enough that it never gets ignored — bypasses Do Not Disturb.
        - conditions:
            - condition: template
              value_template: "{{ priority == 'critical' }}"
          sequence:
            - service: notify.mobile_app_REPLACE_ME  # <-- substitute your device's notify service
              data:
                title: "{{ headline }}"
                message: "{{ description }}"
                data:
                  push:
                    sound:
                      name: "default"
                      critical: 1
                      volume: 1.0

        # high: severe thunderstorm warnings. Normal push, distinct sound —
        # audible, but never bypasses Do Not Disturb.
        - conditions:
            - condition: template
              value_template: "{{ priority == 'high' }}"
          sequence:
            - service: notify.mobile_app_REPLACE_ME  # <-- substitute your device's notify service
              data:
                title: "{{ headline }}"
                message: "{{ description }}"
                data:
                  push:
                    sound: "default"

        # normal: watches, all-clears. Silent — no sound, no DND bypass.
        # An all-clear should never wake anyone up.
        - conditions:
            - condition: template
              value_template: "{{ priority == 'normal' }}"
          sequence:
            - service: notify.mobile_app_REPLACE_ME  # <-- substitute your device's notify service
              data:
                title: "{{ headline }}"
                message: "{{ description }}"
                data:
                  push:
                    sound: null
      default: []

- id: stormwatch_tornado_strobe
  alias: StormWatch - Tornado Warning Lamp Strobe
  description: >-
    Strobes a lamp on/off for ~5s when StormWatch publishes a Tornado Warning
    (stormwatch/event/alert_issued, event == "Tornado Warning"), to physically
    wake a sleeper. Plain-YAML equivalent of the tornado-strobe blueprint.
    Fires ONLY on an exact Tornado Warning — other critical alerts
    (lightning-close, Flash Flood Emergency, Extreme Wind) still notify but
    never touch the lamp. Independent of the notification automations by
    design: testable/disableable on its own, and it can never break the
    critical push path. Ends ON at full brightness so the room stays lit.
    No device/ESP firmware changes are needed — HA drives the whole pattern.
  mode: restart  # a re-issued warning restarts the strobe rather than queuing
  trigger:
    - platform: mqtt
      topic: stormwatch/event/alert_issued
  condition:
    - condition: template
      value_template: "{{ trigger.payload_json.event == 'Tornado Warning' }}"
  action:
    - repeat:
        count: 8  # 8 × (300ms on + 300ms off) ≈ 4.8s
        sequence:
          - service: light.turn_on
            target:
              entity_id: light.smart_lamp_1  # <-- your nightstand lamp; verify the real entity_id in Developer Tools > States
            data:
              brightness_pct: 100
              transition: 0  # hard on/off; a fading bulb turns a strobe to mush
          - delay:
              milliseconds: 300
          - service: light.turn_off
            target:
              entity_id: light.smart_lamp_1  # <-- same lamp
            data:
              transition: 0
          - delay:
              milliseconds: 300
    # End ON at full brightness so the room stays lit while you get to shelter.
    - service: light.turn_on
      target:
        entity_id: light.smart_lamp_1  # <-- same lamp
      data:
        brightness_pct: 100
        transition: 0

- id: stormwatch_pool_closed
  alias: StormWatch - Pool Closed (Lightning Nearby)
  description: >-
    Notifies when StormWatch closes the pool (stormwatch/event/
    lightning_close, lightning inside CLOSE_RADIUS). Plain-YAML equivalent
    of the pool-alerts blueprint's closed branch. Critical by default —
    bypasses Do Not Disturb; edit the payload below to make it a normal
    push if you'd rather it not.
  mode: queued
  max: 10
  trigger:
    - platform: mqtt
      topic: stormwatch/event/lightning_close
  action:
    - service: notify.mobile_app_REPLACE_ME  # <-- substitute your device's notify service
      data:
        title: "Pool closed — lightning nearby"
        message: >-
          Lightning detected {{ trigger.payload_json.distance_km | default('nearby', true) }} km
          away ({{ trigger.payload_json.bearing_compass | default('unknown', true) }}). Get out of
          the water.
        data:
          push:
            sound:
              name: "default"
              critical: 1
              volume: 1.0

- id: stormwatch_pool_all_clear
  alias: StormWatch - Pool All Clear
  description: >-
    Notifies when StormWatch's all-clear timer expires
    (stormwatch/event/all_clear) with no further qualifying lightning.
    Plain-YAML equivalent of the pool-alerts blueprint's all-clear branch.
    Always a normal, silent push — never critical, no exception. An
    all-clear should never wake anyone up (DESIGN.md §8).
  mode: queued
  max: 10
  trigger:
    - platform: mqtt
      topic: stormwatch/event/all_clear
  action:
    - service: notify.mobile_app_REPLACE_ME  # <-- substitute your device's notify service
      data:
        title: "Pool open — all clear"
        message: "No qualifying lightning detected within range for the configured all-clear window."
        data:
          push:
            sound: null
