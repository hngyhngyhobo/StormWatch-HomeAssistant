blueprint:
  name: StormWatch — Severe Weather Alerts
  description: >-
    Notifies a phone when StormWatch publishes an NWS alert on
    stormwatch/event/alert_issued, routed by priority per the
    StormWatch notification discipline (see DESIGN.md §8):

    - critical = WAKE ME UP (tornado / hurricane / extreme wind warnings,
      lightning inside CLOSE_RADIUS): the iOS critical-alert push, which
      sounds even through Do Not Disturb and the silent switch.
    - high = Heads-up (e.g. high wind, severe thunderstorm, flash flood
      warnings, tornado watch): pops up on screen with no sound. Turn on
      "Heads-up alerts make a sound" if you want a sound. Never bypasses
      Do Not Disturb.
    - normal = Silent push (e.g. flood watch, freeze warning): goes
      straight to the notification list. No pop-up, no sound.

    Works on iPhone and Android. On Android, WAKE ME UP rings on the alarm
    stream (even on vibrate/silent); to break through Do Not Disturb and to
    make Heads-up silent, see "Android" in docs/HOME-ASSISTANT.md.

    Which NWS alert gets which level is set from the StormWatch device's
    dropdowns in Home Assistant, or in /config/alerts.yaml.
  domain: automation
  source_url: https://github.com/hngyhngyhobo/StormWatch-HomeAssistant/blob/main/examples/blueprints/stormwatch_severe_alerts.yaml
  input:
    notify_device:
      name: Notify Device
      description: The mobile_app device to notify.
      selector:
        device:
          filter:
            - integration: mobile_app
    critical_enabled:
      name: Enable Critical Alerts
      description: >-
        When on, critical-priority alerts (e.g. Tornado Warning) use the
        iOS critical-alert push. When off, critical alerts fall back to a
        normal (non-DND-bypassing) push instead.
      default: true
      selector:
        boolean: {}
    heads_up_sound:
      name: Heads-up alerts make a sound
      description: >-
        When off (the default), heads-up (high-priority) alerts pop up on
        screen with no sound. When on, they play the default notification
        sound. Either way they never bypass Do Not Disturb.
      default: false
      selector:
        boolean: {}

mode: queued
max: 10

trigger:
  - platform: mqtt
    topic: stormwatch/event/alert_issued

variables:
  headline: "{{ trigger.payload_json.headline }}"
  priority: "{{ trigger.payload_json.priority }}"
  description: "{{ trigger.payload_json.description }}"
  critical_enabled: !input critical_enabled
  heads_up_sound: !input heads_up_sound

action:
  - choose:
      # critical: tornado warnings, lightning inside CLOSE_RADIUS. Rare
      # enough that it never gets ignored.
      - conditions:
          - condition: template
            value_template: "{{ priority == 'critical' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ critical_enabled }}"
                sequence:
                  - device_id: !input notify_device
                    domain: mobile_app
                    type: notify
                    title: "{{ headline }}"
                    message: "{{ description }}"
                    data:
                      # iPhone: critical alert (breaks Do Not Disturb + silent).
                      push:
                        sound:
                          name: "default"
                          critical: 1
                          volume: 1.0
                      # Android: ring on the alarm stream, even on vibrate/silent.
                      # Each phone ignores the other platform's keys.
                      ttl: 0
                      priority: high
                      channel: alarm_stream
            default:
              # critical_enabled toggled off — send a normal push instead
              # of the DND-bypassing critical-alert payload.
              - device_id: !input notify_device
                domain: mobile_app
                type: notify
                title: "{{ headline }}"
                message: "{{ description }}"
                data:
                  push:
                    sound: "default"
                  ttl: 0
                  priority: high
                  channel: StormWatch Alerts
                  importance: high

      # high = Heads-up: pops up on screen, silent unless heads_up_sound
      # is on. Never bypasses Do Not Disturb.
      - conditions:
          - condition: template
            value_template: "{{ priority == 'high' }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ headline }}"
            message: "{{ description }}"
            data:
              push:
                # "none" (the string) is how the HA push relay sends a
                # notification with no sound. An empty/null value is rejected.
                sound: "{{ 'default' if heads_up_sound else 'none' }}"
              # Android: pops up on its own channel. Android decides the sound
              # per channel; turn sound off for "StormWatch Heads-up" in the
              # phone's notification settings for a silent pop-up.
              ttl: 0
              priority: high
              channel: StormWatch Heads-up
              importance: high

      # normal = Silent push: straight to the notification list, no pop-up,
      # no sound. An all-clear should never wake anyone up.
      - conditions:
          - condition: template
            value_template: "{{ priority == 'normal' }}"
        sequence:
          - device_id: !input notify_device
            domain: mobile_app
            type: notify
            title: "{{ headline }}"
            message: "{{ description }}"
            data:
              push:
                sound: "none"
                interruption-level: passive
              # Android: low importance = no sound, no pop-up.
              channel: StormWatch Silent
              importance: low
    default: []
